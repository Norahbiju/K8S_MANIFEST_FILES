apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-deployment
  namespace: norah-ns
  labels:
    app: fitness-deploy
spec:
  replicas: 8
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
      maxSurge: 2
  selector:
    matchLabels:
      app: fitness
  template:
    metadata:
      labels:
        app: fitness
    spec:
      containers:
        - name: fitness-container
          image: muralisocial123/transaction-app:v1.0.0
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: fitness-deployment-svc
  namespace: norah-ns
spec:
  selector:
    app: fitness
  ports:
    - port: 3001 #it is a service port number
      targetPort: 3000 # it is a container port number
      protocol: TCP
  type: ClusterIP