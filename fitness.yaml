apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-deployment
  namespace: norah-ns
  labels:
    app: fitness-deploy
spec:
  replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  selector:
    matchLabels:
      app: fitness
  template:
    metadata:
      labels:
        app: fitness
    spec:
      containers:
        - name: fitness-container
          image: muralisocial123/fitness-app:v1.0.0
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu:  "100m"
            limits:
              memory: "256Mi"
              cpu:  "200m"


---
apiVersion: v1
kind: Service
metadata:
  name: fitness-deployment-svc
  namespace: norah-ns
spec:
  selector:
    app: fitness
  ports:
    - port: 5001 #it is a service port number
      targetPort: 5000 # it is a container port number
      protocol: TCP
  type: NodePort