apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-deployment
  namespace: norah-ns
  labels:
    app: fitness-deploy
spec:
  repilicas: 8
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxunavailable: 2
      maxsurge: 2
  selector:
    matchLabels:
      app: fitness
  template:
    metadata:
      labels:
        app: fitness
    spec:
      containers:
        - name: fitness-container
          image: muralisocial123/fitness-app:v1.0.1
          ports:
            - containerPort: 3000
