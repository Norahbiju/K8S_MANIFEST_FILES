apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  namespace: norah-ns
  labels: 
    app: my-deployment 
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: deploymentlabel
  template:
    metadata:
      labels:
        app: deploymentlabel
    spec:
      containers:
        - name: mydeployment-container
          image: muralisocial123/flipkart-app-web:v1.1.0
          ports:
            - containerPort: 80
